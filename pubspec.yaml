name: planpal
description: PlanPal — task and workspace management app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & routing
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1

  # Supabase & auth
  supabase_flutter: ^2.8.4
  google_sign_in: ^6.2.2

  # HTTP
  dio: ^5.8.0+1

  # Local database (Drift/SQLite)
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.25
  path_provider: ^2.1.5
  path: ^1.9.0

  # Connectivity
  connectivity_plus: ^6.1.1

  # Secure storage
  flutter_secure_storage: ^9.2.2

  # Localization
  intl: ^0.20.2

  # Charts
  fl_chart: ^0.70.2

  # File handling
  file_picker: ^8.1.7
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Rich text editor
  flutter_quill: ^11.0.0

  # Utils
  url_launcher: ^6.3.1
  window_manager: ^0.4.3
  uuid: ^4.5.1

  # Icons (Lucide style)
  lucide_icons_flutter: ^3.1.14

  # Google Fonts
  google_fonts: ^6.3.3

  # Calendar
  table_calendar: ^3.2.0
  desktop_drop: ^0.8.4
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  flutter_local_notifications: ^22.3.2
  share_plus: ^12.0.2
  flutter_timezone: ^5.1.1
  timezone: ^0.11.2
  pdfrx: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.22.2
  build_runner: ^2.4.13
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/



flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/planpal-logo.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/images/planpal-logo.png"
    icon_size: 256
