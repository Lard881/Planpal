name: planpal
description: PlanPal — task and workspace management app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & routing
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1

  # Supabase & auth
  supabase_flutter: ^2.8.4
  google_sign_in: ^6.2.2

  # HTTP
  dio: ^5.8.0+1

  # Local database (Drift/SQLite)
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.25
  path_provider: ^2.1.5
  path: ^1.9.0

  # Connectivity
  connectivity_plus: ^6.1.1

  # Secure storage
  flutter_secure_storage: ^9.2.2

  # Localization
  intl: ^0.20.2

  # Charts
  fl_chart: ^0.70.2

  # File handling
  file_picker: ^8.1.7
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Rich text editor
  flutter_quill: ^11.0.0

  # Utils
  url_launcher: ^6.3.1
  window_manager: ^0.4.3
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  equatable: ^2.0.7

  # Icons (Lucide style)
  lucide_icons_flutter: ^3.1.14

  # Firebase (FCM push notifications)
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10

  # Google Fonts
  google_fonts: ^6.3.3

  # Calendar
  table_calendar: ^3.2.0

  # Image display
  octo_image: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.22.2
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.4
  freezed: ^2.5.8
  json_serializable: ^6.9.5
  mocktail: ^1.0.4

flutter:
  generate: true
  uses-material-design: true

  assets:
    - prompts/design/logo/


