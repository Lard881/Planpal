flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  
  # Android adaptive icon
  adaptive_icon_background: "#2196F3"
  adaptive_icon_foreground: "assets/images/logo.png"
  
  # iOS specific
  remove_alpha_ios: true
  
  # Windows
  windows:
    generate: true
    image_path: "assets/images/logo.png"
    icon_size: 256
